<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini AI Project</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f1f5f9;
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
    }
    h1 {
      color: #0f172a;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    p {
      color: #64748b;
      font-size: 1rem;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      background: #e0f2fe;
      color: #0369a1;
      font-weight: 600;
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Online</div>
    <h1>ระบบพร้อมทำงานแล้ว</h1>
    <p>เชื่อมต่อจาก GitHub Pages สู่ Google Sites สำเร็จเรียบร้อย</p>
  </div>
</body>
</html>
